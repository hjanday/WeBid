<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }
    form {
      max-width: 300px;
      margin: 0 auto;
      padding: 15px;
      border: 1px solid #ccc;
      background: #fff;
    }
    label, input {
      display: block;
      width: 100%;
      margin-bottom: 10px;
    }
    input {
      padding: 8px;
    }
    button {
      padding: 10px;
      background: #28a745;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Sign Up</h1>
  <form method="POST" action="/api/auth/register">
    <label for="signupUsername">Username:</label>
    <input type="text" id="signupUsername" name="username" required>
    
    <label for="signupEmail">Email:</label>
    <input type="email" id="signupEmail" name="email" required>
    
    <label for="signupPassword">Password:</label>
    <input type="password" id="signupPassword" name="password" required>
    
    <label for="signupFirstName">First Name:</label>
    <input type="text" id="signupFirstName" name="firstName" required>
    
    <label for="signupLastName">Last Name:</label>
    <input type="text" id="signupLastName" name="lastName" required>
    
    <label for="signupAddress">Address:</label>
    <input type="text" id="signupAddress" name="address" required>
    
    <label for="signupPostalCode">Postal Code:</label>
    <input type="text" id="signupPostalCode" name="postalCode" required>
    
    <label for="signupCountry">Country:</label>
    <input type="text" id="signupCountry" name="country" required>
    
    <label for="signupCity">City:</label>
    <input type="text" id="signupCity" name="city" required>
    
    <button type="submit">Sign Up</button>
  </form>
  <p style="text-align:center;">Already have an account? <a href="/index.html">Login</a></p>
</body>
</html>
