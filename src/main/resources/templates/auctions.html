<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auction Search & Bid</title>
  <style>
    /* Reset and basic body styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f9f9f9;
      font-family: Arial, sans-serif;
      padding: 1rem;
    }
    /* Header styling */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    header .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }
    header nav a {
      text-decoration: none;
      color: #fff;
      background-color: #007bff;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      margin-left: 0.5rem;
    }
    header nav a:hover {
      background-color: #0056b3;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2rem;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }
    /* Form styling */
    #auctionForm {
      max-width: 400px;
      margin: 0 auto 1rem auto;
      background-color: #fff;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #auctionForm label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    #auctionForm input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #auctionForm button {
      width: 100%;
      padding: 0.75rem;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #auctionForm button:hover {
      background-color: #0056b3;
    }
    /* Error message */
    #errorMessage {
      text-align: center;
      color: red;
      margin-bottom: 1rem;
    }
    /* Auction table */
    #auctionTable {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      border-collapse: collapse;
      display: none; /* hidden by default */
    }
    #auctionTable thead tr {
      background-color: #eee;
    }
    #auctionTable th, #auctionTable td {
      border: 1px solid #ccc;
      padding: 0.75rem;
      text-align: left;
    }
    #auctionTable tr:hover {
      background-color: #f0f0f0;
    }
    /* Bid Now button */
    #bidNowButton {
      display: none; /* hidden until a radio button is selected */
      margin: 1.5rem auto 0 auto;
      padding: 0.75rem 1.5rem;
      background-color: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: block;
    }
    #bidNowButton:hover {
      background-color: #218838;
    }

    #buyNowButton {
      padding: 0.75rem 1.5rem;
      background-color: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #buyNowButton:hover {
      background-color: #218838;
    }
    /* Forward Auction Detail Section */
    #auctionSection {
      display: none; /* hidden by default */
      max-width: 800px;
      margin: 1.5rem auto 0 auto;
      background-color: #fff;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    /* Two-column layout for forward section */
    .forward-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .forward-left,
    .forward-right {
      flex: 1 1 300px;
    }
    .forward-left h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    .forward-right label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .forward-right input[type="number"] {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #faPlaceBidButton {
      padding: 0.75rem 1.5rem;
      background-color: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #faPlaceBidButton:hover {
      background-color: #218838;
    }

    #editDutchBtn {
      padding: 0.8rem 1.5rem;
      background-color: #0844c5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #editDutchBtn:hover {
      background-color: #0844c5;
    }

    #payNowButton {
      padding: 0.8rem 1.5rem;
      background-color: #0844c5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #payNowButton:hover {
      background-color: #0844c5;
    }
  </style>
</head>
<script src="/logout.js"></script>
<body>

  <header>
    <div class="logo">WeBid</div>
    <nav>
      <a href="#" onclick="logout()">Logout</a>
      <a href="/createauction">Create Auction</a>
    </nav>
  </header>

  

  <h1>Auction Search</h1>

  <form id="auctionForm">
    <label for="itemNameInput">Enter Auction Item Name:</label>
    <input type="text" id="itemNameInput" placeholder="Item Name" required>
    <button type="submit">Search Auctions</button>
  </form>


  <div id="errorMessage"></div>

  <table id="auctionTable">
    <thead>
      <tr>
        <th>Item Name</th>
        <th>Current Bid</th>
        <th>Auction Type</th>
        <th>Remaining Time</th>
        <th>Select</th>
      </tr>
    </thead>
    <tbody id="auctionTbody"></tbody>
  </table>


  <button id="bidNowButton">Bid Now</button>

  
  <div id="auctionSection">
    <h2>Screen for Bidding on Auctions</h2>
    <div class="forward-container">
   
      <div class="forward-left">
        <h3 id="faItemName"></h3>
        <p id="faDescription"></p>
        <p id="faShippingPrice"></p>
      </div>
     
      <div class="forward-right">
        <p id="faCurrentPrice"></p>
        <p id="faHighestBidder"></p>
        <label for="faBidAmount" id="bidLabel">Your Bid:</label>
        <input type="number" step="0.01" id="faBidAmount" placeholder="Enter your bid amount">
        <button id="faPlaceBidButton">Place Bid</button>
        <button id="payNowButton">Pay Now</button>
        <button id="buyNowButton">Buy Now</button>
        <button id ="editDutchBtn">Edit Dutch Auction</button>
      </div>
    </div>
  </div>

  <script>
    let selectedAuction = null;
    // hide bids
    document.getElementById("bidNowButton").style.display = "none";
    document.getElementById("buyNowButton").style.display = "none";
    document.getElementById("editDutchBtn").style.display = "none";
    // pick radio btn
    function onRadioSelect(auction) {
      selectedAuction = auction;
      document.getElementById("bidNowButton").style.display = "block";
    }

    // update bid
    document.getElementById("bidNowButton").addEventListener("click", function() {
      if (!selectedAuction) return;
      if ((selectedAuction.auctionType || "").toLowerCase() === "forward") {
        showauctionSection(selectedAuction);
      } else if ((selectedAuction.auctionType || "").toLowerCase() === "dutch") {
        showauctionSectionDutch(selectedAuction)
      }
    });

    // fwd
    function showauctionSection(auction) {
      document.getElementById("auctionTable").style.display = "none";
      document.getElementById("bidNowButton").style.display = "none";
      document.getElementById("buyNowButton").style.display = "none";
      document.getElementById("faPlaceBidButton").style.display = "block";
      document.getElementById("payNowButton").style.display = "block";
      document.getElementById("faItemName").textContent = auction.itemName || "";
      document.getElementById("faDescription").textContent = "Description: " + (auction.description || "N/A");
      document.getElementById("faShippingPrice").textContent = "Shipping Price: $" + auction.expeditedShippingCost; // Adjust if needed

      const currentBidText = (auction.currentBid != null && auction.currentBid !== "") 
        ? "$" + auction.currentBid 
        : "No Bid Yet";
      document.getElementById("faCurrentPrice").textContent = "Current Price: " + currentBidText;

      const highestBidderText = auction.currentBidderID || "Unknown";
      document.getElementById("faHighestBidder").textContent = "Highest Bidder: " + highestBidderText;

      document.getElementById("auctionSection").style.display = "block";
    }
    // dutch
    function showauctionSectionDutch(auction) {
      document.getElementById("auctionTable").style.display = "none";
      document.getElementById("bidNowButton").style.display = "none";
      document.getElementById("faPlaceBidButton").style.display = "none";
      document.getElementById("payNowButton").style.display = "none";
      document.getElementById("buyNowButton").style.display = "block";
      document.getElementById("faBidAmount").style.display = "none";
      document.getElementById("bidLabel").style.display = "none";
      document.getElementById("editDutchBtn").style.display = "block";



      document.getElementById("faItemName").textContent = auction.itemName || "";
      document.getElementById("faDescription").textContent = "Description: " + (auction.description || "N/A");
      document.getElementById("faShippingPrice").textContent = "Shipping Price: $" + auction.expeditedShippingCost; // Adjust if needed

      const currentBidText = (auction.currentBid != null && auction.currentBid !== "") 
        ? "$" + auction.currentBid 
        : "No Bid Yet";
      document.getElementById("faCurrentPrice").textContent = "Current Price: " + currentBidText;
      document.getElementById("auctionSection").style.display = "block";
    }

    // edit dutch
    document.getElementById("editDutchBtn").addEventListener("click", function() {
      if (!selectedAuction) return;
      var editDutchUrl = `/api/auctions/dutch/${selectedAuction.id}`;
      fetch(editDutchUrl, {
        method: "PUT",
        headers: {"Authorization": `Bearer ${localStorage.getItem("jwtToken")}`}
      })
      .then(
        response => {
          if (!response.ok) {
            alert("You are not authorized to edit this auction!");
            return response.text().then(text => { throw new Error(text); });
          }
          alert("Dutch auction decremented successfully!");
          return response.json();
        }
      )
    });
   
    // place bid
    document.getElementById("faPlaceBidButton").addEventListener("click", function() {
      if (!selectedAuction) return;
      const bidAmount = document.getElementById("faBidAmount").value;
    
      const token = localStorage.getItem("jwtToken");
      if (!token) {
        alert("User is not logged in.");
        return;
      }
      const url = `http://localhost:8080/api/bid/${selectedAuction.id}?bidAmount=${bidAmount}`;
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` }
      }) .then(response => {
        if (!response.ok) {
          return response.text().then(text => { throw new Error(text); });
        }
        return response.json();
      })
      .then(updatedAuction => {
        let auc = updatedAuction.auction;
        alert("Bid placed successfully!");
        // update auc
        const newCurrentBid = (auc.currentBid != null && auc.currentBid !== "") 
                              ? "$" + auc.currentBid 
                              : "No Bid Yet";
        document.getElementById("faCurrentPrice").textContent = "Current Price: " + newCurrentBid;
        document.getElementById("faHighestBidder").textContent = "Highest Bidder: " + (auc.currentBidderID || "Unknown")

        if(calculateRemainingTime(auc.endTime) == "Expired"){
          alert("Auction is over! Please pay for your bid!");
          window.location.href = "/paynow"
        }
      })
      .catch(error => {
        alert("Bid failed: " + error.message);
      });
    });

    document
        .getElementById("payNowButton")
        .addEventListener("click", function () {
          if (!selectedAuction) return;

          const bidAmount = document.getElementById("faBidAmount").value;

          // Retrieve the JWT token from localStorage
          const token = localStorage.getItem("jwtToken");
          if (!token) {
            alert("User is not logged in.");
            return;
          }

          const auctionUrl = `http://localhost:8080/api/auctions/${selectedAuction.id}`;

          // Fetch auction data
          fetch(auctionUrl, {
            method: "GET",
            headers: {
              "Authorization": `Bearer ${token}`, // Fixed string interpolation
            },
          })
            .then((response) => {
              if (!response.ok) {
                throw new Error("Failed to fetch auction data");
              }
              return response.json();
            })
            .then((auctionData) => {
              // Redirect to the payment page with auction ID as a URL parameter
              window.location.href = `/paynow?auctionId=${selectedAuction.id}`;
            })
            .catch((error) => {
              console.error("Error fetching auction data:", error);
              alert("Failed to retrieve auction data. Please try again.");
            });
        });

    document.getElementById("buyNowButton").addEventListener("click", function() {
      if (!selectedAuction) return;
      const token = localStorage.getItem("jwtToken");
      if (!token) {
        alert("User is not logged in.");
        return;
      }
      const url = `http://localhost:8080/api/auctions/complete/${selectedAuction.id}`;
      fetch(url, {
        method: "PUT",
        headers: {"Authorization": `Bearer ${token}`}
      }) .then(response => {
        console.log(response);
        if (!response.ok) {
          return new Error(response);
        }
        alert("Dutch auction completed successfully!");
        window.location.href = `/paynow?auctionId=${selectedAuction.id}`;
        return response;
      })
      .catch(error => {
        alert("Dutch complete failed: " + error.message);
      });
    });
    // handle form
    document.getElementById("auctionForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const itemName = document.getElementById("itemNameInput").value.trim();
      const url = "/api/auctions/search?itemName=" + encodeURIComponent(itemName);

      fetch(url, {
        method: "GET",
        headers: { "Content-Type": "application/json" }
      })
      .then(response => {
        if (!response.ok) {
          return response.text().then(text => { throw new Error(text); });
        }
        return response.json();
      })
      .then(data => {
        document.getElementById("errorMessage").textContent = "";
        const tbody = document.getElementById("auctionTbody");
        tbody.innerHTML = "";
        selectedAuction = null;
        
        document.getElementById("auctionSection").style.display = "none";
        document.getElementById("bidNowButton").style.display = "none";

        if (data.length === 0) {
          document.getElementById("auctionTable").style.display = "none";
          document.getElementById("errorMessage").textContent = "No auctions found.";
          return;
        }

        document.getElementById("auctionTable").style.display = "table";

        data.forEach(auction => {
          const row = document.createElement("tr");

         
          const cellItemName = document.createElement("td");
          cellItemName.textContent = auction.itemName || "";
          row.appendChild(cellItemName);

         
          const cellCurrentBid = document.createElement("td");
          cellCurrentBid.textContent = (auction.currentBid != null && auction.currentBid !== "")
            ? "$" + auction.currentBid 
            : "No Bid Yet";
          row.appendChild(cellCurrentBid);

          const cellAuctionType = document.createElement("td");
          cellAuctionType.textContent = auction.auctionType || "";
          row.appendChild(cellAuctionType);

          
          const cellRemainingTime = document.createElement("td");
          if ((auction.auctionType || "").toLowerCase() === "forward") {
            if (auction.endTime) {
              cellRemainingTime.textContent = calculateRemainingTime(auction.endTime);
            } else {
              cellRemainingTime.textContent = "N/A";
            }
          } else if ((auction.auctionType || "").toLowerCase() === "dutch") {
            cellRemainingTime.textContent = "now";
          } else {
            cellRemainingTime.textContent = "";
          }
          row.appendChild(cellRemainingTime);

          
          const cellSelect = document.createElement("td");
          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "auctionSelect";
          radio.addEventListener("click", function() {
            onRadioSelect(auction);
          });
          cellSelect.appendChild(radio);
          row.appendChild(cellSelect);

          tbody.appendChild(row);
        });
      })
      .catch(error => {
        document.getElementById("errorMessage").textContent = "Error: " + error.message;
        document.getElementById("auctionTable").style.display = "none";
        document.getElementById("auctionSection").style.display = "none";
      });
    });

    // ger
    function calculateRemainingTime(endTime) {
      const now = new Date();
      const end = new Date(endTime);
      let diff = end - now;
      if (diff <= 0) {
        return "Expired";
      }
      const hours = Math.floor(diff / (1000 * 60 * 60));
      diff -= hours * (1000 * 60 * 60);
      const minutes = Math.floor(diff / (1000 * 60));
      diff -= minutes * (1000 * 60);
      const seconds = Math.floor(diff / 1000);
      return `${hours}h ${minutes}m ${seconds}s`;
    }
  </script>
</body>
</html>
