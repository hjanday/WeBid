<!DOCTYPE html> <!--  THIS IS THE LOGIN.HTML -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/signin.css">
      <header>
        <div class="logo"><a>WeBid</a></div>      
      </header>
</head>
<body>
  <h1 style="text-align:center;">Login</h1>
  <form id="login_form">
    <label>Email:</label>
    <input type="email" id="email" required>
    <br>
    <label>Password:</label>
    <input type="password" id="password" required>
    <br>
    <button type="submit">Login</button>
  </form>
  <script src="/signin.js"></script>

  <p style="text-align:center;">Don't have an account? <a href="/authentication/register">Sign Up</a></p>
  <p style ="text-align: center;">Forgot your password? <a href="/authentication/forgotpassword">Reset your password</a></p>
</body>
</html>
