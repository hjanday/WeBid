<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Auction</title>
  <style>
    /* Basic reset and body styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 20px;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 20px;
    }
    header {
      max-width: 600px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .nav-buttons a {
      text-decoration: none;
      color: #fff;
      background-color: #007bff;
      padding: 8px 12px;
      border-radius: 4px;
      margin-left: 8px;
    }
    header .nav-buttons a:hover {
      background-color: #0056b3;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="number"],
    input[type="datetime-local"],
    textarea,
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea {
      resize: vertical;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <!-- Header with navigation links -->
  <header>
    <div class="nav-buttons">
      <a href="/login">Logout</a>
      <a href="/auctions">View Auctions</a>
    </div>
  </header>

  <div class="container">
    <h1>Create Auction</h1>
    <form id="auctionForm">
      <div class="form-group">
        <label for="itemName">Item Name *</label>
        <input type="text" id="itemName" name="itemName" required>
      </div>
      <div class="form-group">
        <label for="description">Description *</label>
        <textarea id="description" name="description" rows="3" required></textarea>
      </div>
      <!-- Owner ID is not provided in the form; it is retrieved using the JWT token -->
      <div class="form-group">
        <label for="lowestBid">Lowest Bid *</label>
        <input type="number" step="0.01" id="lowestBid" name="lowestBid" required>
      </div>
      <div class="form-group">
        <label for="bidIncrement">Bid Increment *</label>
        <input type="number" step="0.01" id="bidIncrement" name="bidIncrement" required>
      </div>
      <!-- No start time input; start time is set to current time automatically -->
      <div class="form-group">
        <label for="endTime">End Time (optional)</label>
        <input type="datetime-local" id="endTime" name="endTime">
      </div>
      <div class="form-group">
        <label for="auctionType">Auction Type *</label>
        <select id="auctionType" name="auctionType" required>
          <option value="FORWARD">FORWARD</option>
          <option value="DUTCH">DUTCH</option>
        </select>
      </div>
      <div class="form-group">
        <label for="expeditedShippingCost">Expedited Shipping Cost *</label>
        <input type="number" step="0.01" id="expeditedShippingCost" name="expeditedShippingCost" required>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="expeditedShipping" name="expeditedShipping">
          Expedited Shipping?
        </label>
      </div>
      <button type="submit">Create Auction</button>
    </form>
  </div>

  <script>
    document.getElementById("auctionForm").addEventListener("submit", function(event) {
      event.preventDefault();

      // Gather form values
      const itemName = document.getElementById("itemName").value;
      const description = document.getElementById("description").value;
      const lowestBid = parseFloat(document.getElementById("lowestBid").value);
      const bidIncrement = parseFloat(document.getElementById("bidIncrement").value);
      const endTimeInput = document.getElementById("endTime").value;
      const auctionType = document.getElementById("auctionType").value;
      const expeditedShippingCost = parseFloat(document.getElementById("expeditedShippingCost").value);
      const expeditedShipping = document.getElementById("expeditedShipping").checked;

      // Retrieve JWT token from localStorage
      const token = localStorage.getItem("jwtToken");
      if (!token) {
        alert("User is not logged in.");
        return;
      }

      // First, get the current user's ID using the token
      fetch("/api/users/getdetails", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(token)
      })
      .then(response => {
        if (!response.ok) {
          return response.text().then(text => { throw new Error(text); });
        }
        return response.json();
      })
      .then(data => {
        const ownerID = Number(data);

        // Construct auction object. Automatically set startTime to current time.
        const auction = {
          itemName,
          description,
          ownerID,
          lowestBid,
          bidIncrement,
          auctionType,
          expeditedShippingCost,
          expeditedShipping,
          startTime: new Date().toISOString()
        };
        if (endTimeInput) {
          auction.endTime = new Date(endTimeInput).toISOString();
        }

        // Send POST request to create auction
        return fetch("http://localhost:8080/api/auctions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(auction)
        });
      })
      .then(response => {
        if (!response.ok) {
          return response.text().then(text => { throw new Error(text); });
        }
        return response.json();
      })
      .then(data => {
        alert("Auction created successfully!");
        console.log("Created Auction:", data);
        window.location.href = "/auctions"
      })
      .catch(error => {
        alert("Error creating auction: " + error.message);
      });
    });
  </script>
</body>
</html>
