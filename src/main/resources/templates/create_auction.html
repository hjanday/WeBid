<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Auction</title>
  <style>
    /* Basic reset and body styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 20px;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 20px;
    }
    header {
      max-width: 600px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .nav-buttons a {
      text-decoration: none;
      color: #fff;
      background-color: #007bff;
      padding: 8px 12px;
      border-radius: 4px;
      margin-left: 8px;
    }
    header .nav-buttons a:hover {
      background-color: #0056b3;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="number"],
    input[type="datetime-local"],
    textarea,
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea {
      resize: vertical;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <!-- Header with navigation links -->
  <header>
    <div class="logo">My Auction App</div>
    <div class="nav-buttons">
      <a href="/login">Logout</a>
      <a href="/auctions">View Auctions</a>
    </div>
  </header>

  <div class="container">
    <h1>Create Auction</h1>
    <form id="auctionForm">
      <div class="form-group">
        <label for="auctionType">Auction Type *</label>
        <select id="auctionType" name="auctionType" required>
          <option value="FORWARD">FORWARD</option>
          <option value="DUTCH">DUTCH</option>
        </select>
      </div>
      <div class="form-group">
        <label for="itemName">Item Name *</label>
        <input type="text" id="itemName" name="itemName" required>
      </div>
      <div class="form-group">
        <label for="description">Description *</label>
        <textarea id="description" name="description" rows="3" required></textarea>
      </div>

      <!-- Lowest Bid group (hidden when DUTCH) -->
      <div class="form-group" id="lowestBidGroup">
        <label for="lowestBid">Lowest Bid *</label>
        <input type="number" step="0.01" id="lowestBid" name="lowestBid" required>
      </div>

      <div class="form-group">
        <label for="bidIncrement">Bid Increment *</label>
        <input type="number" step="0.01" id="bidIncrement" name="bidIncrement" required>
      </div>
      

      <!-- Current Bid field (hidden unless DUTCH is selected) -->
      <div class="form-group" id="currentBidGroup" style="display: none;">
        <label for="currentBid">Current Bid *</label>
        <input type="number" step="0.01" id="currentBid" name="currentBid">
      </div>

      <div class="form-group">
        <label for="expeditedShippingCost">Expedited Shipping Cost *</label>
        <input type="number" step="0.01" id="expeditedShippingCost" name="expeditedShippingCost" required>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="expeditedShipping" name="expeditedShipping">
          Expedited Shipping?
        </label>
      </div>
      <button type="submit">Create Auction</button>
    </form>
  </div>

  <script>
    // Grab DOM references
    const auctionTypeSelect = document.getElementById("auctionType");
    const lowestBidGroup = document.getElementById("lowestBidGroup");
    const currentBidGroup = document.getElementById("currentBidGroup");

    const lowestBidInput = document.getElementById("lowestBid");
    const currentBidInput = document.getElementById("currentBid");

    // Show/hide fields based on auction type
    auctionTypeSelect.addEventListener("change", function() {
      if (this.value === "DUTCH") {
        // Show currentBid, hide lowestBid
        currentBidGroup.style.display = "block";
        currentBidInput.required = true;

        lowestBidGroup.style.display = "none";
        lowestBidInput.required = false;
        lowestBidInput.value = ""; // clear out any leftover data
      } else {
        // Show lowestBid, hide currentBid
        currentBidGroup.style.display = "none";
        currentBidInput.required = false;
        currentBidInput.value = ""; // clear out any leftover data

        lowestBidGroup.style.display = "block";
        lowestBidInput.required = true;
      }
    });

    document.getElementById("auctionForm").addEventListener("submit", function(event) {
      event.preventDefault();

      // Gather form values
      const itemName = document.getElementById("itemName").value;
      const description = document.getElementById("description").value;
      const bidIncrement = parseFloat(document.getElementById("bidIncrement").value);
      const auctionType = auctionTypeSelect.value;
      const expeditedShippingCost = parseFloat(document.getElementById("expeditedShippingCost").value);
      const expeditedShipping = document.getElementById("expeditedShipping").checked;

      // Retrieve JWT token from localStorage
      const token = localStorage.getItem("jwtToken");
      if (!token) {
        alert("User is not logged in.");
        return;
      }

      // Construct auction object
      const auction = {
        itemName,
        description,
        bidIncrement,
        auctionType,
        expeditedShippingCost,
        expeditedShipping,
        startTime: new Date().toISOString()
      };

      // For DUTCH auctions, include currentBid
      // For FORWARD auctions, include lowestBid
      if (auctionType === "DUTCH") {
        auction.currentBid = parseFloat(currentBidInput.value);
      } else {
        auction.lowestBid = parseFloat(lowestBidInput.value);
      }

      // Send POST request to create auction with Bearer token
      fetch("http://localhost:8080/api/auctions/create", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(auction)
      })
      .then(response => {
        if (!response.ok) {
          return response.text().then(text => { throw new Error(text); });
        }
        return response.json();
      })
      .then(data => {
        alert("Auction created successfully!");
        console.log("Created Auction:", data);
        // Optionally redirect to /auctions
        window.location.href = "/auctions";
      })
      .catch(error => {
        alert("Error creating auction: " + error.message);
      });
    });
  </script>
</body>
</html>
