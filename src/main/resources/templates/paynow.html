<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Auction Ended – Pay Now</title>
    <style>
      /* Basic Reset */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #f9f9f9;
        font-family: Arial, sans-serif;
        padding: 1rem;
      }

      /* Header */
      header {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
      }
      .logo {
        font-size: 1.8rem;
        font-weight: bold;
      }

      /* Main Container */
      .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 1.5rem;
      }

      h1 {
        font-size: 1.8rem;
        text-align: center;
        margin-bottom: 1rem;
      }
      .item-description {
        margin-bottom: 1rem;
      }

      /* Shipping Options */
      .shipping-options {
        margin: 1rem 0;
        padding: 1rem;
        background-color: #f3f3f3;
        border-radius: 4px;
      }
      .shipping-options label {
        display: block;
        margin-bottom: 0.5rem;
      }
      .shipping-options input[type="radio"] {
        margin-right: 0.5rem;
      }

      /* Pay Now Button */
      .pay-now-btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background-color: #28a745;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 1rem;
      }
      .pay-now-btn:hover {
        background-color: #218838;
      }

      /* Price info */
      .price-info {
        margin: 0.5rem 0;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <!-- Header/Logo -->
    <header>
      <div class="logo">My Auction App</div>
    </header>

    <!-- Main Content Container -->
    <div class="container">
      <h1>Bidding Ended!</h1>
      <!-- Item / Auction Details -->
      <div class="item-description">
        <p>
          <strong>Item Description:</strong>
          <span id="itemDesc">Loading...</span>
        </p>
        <p class="price-info">
          Winning Price: $<span id="winningPrice">0</span>
        </p>
        <p class="price-info">
          Highest Bidder: <span id="highestBidder">???</span>
        </p>
      </div>

      <!-- Shipping Options (Radio Buttons) -->
      <div class="shipping-options">
        <p><strong>Shipping Options:</strong></p>
        <!-- Hardcode some shipping cost values, or derive them from the API if needed -->
        <label>
          <input
            type="radio"
            name="shippingOption"
            value="0"
            amount="0"
            checked
          />
          Standard Shipping - Free
        </label>
        <label>
          <input type="radio" name="shippingOption" value="1" amount="0" />
          <span id="expship_label">Express Shipping - Error</span>
        </label>
      </div>

      <label id="radioSelected">No additional fees!</label>
      <br />

      <!-- Pay Now Button -->
      <button class="pay-now-btn" id="payNowButton">Pay Now</button>
    </div>

    <script>
      // 1) Grab the auction ID from the URL
      const urlParams = new URLSearchParams(window.location.search);
      const auctionID = urlParams.get("auctionId");
      const auctionUrl = `http://localhost:8080/api/auctions/${auctionID}`;

      // 2) Fetch auction info on page load
      window.onload = function () {
        fetch(auctionUrl)
          .then((response) => {
            console.log(response);
            if (!response.ok) {
              throw new Error("Failed to fetch auction data");
            }
            return response.json();
          })
          .then((data) => {
            // Insert the data into the page
            document.getElementById("itemDesc").textContent =
              data.description || "No description";
            document.getElementById("winningPrice").textContent =
              data.currentBid || 0;
            document.getElementById("highestBidder").textContent =
              data.currentBidderID || "N/A";
            document.getElementById("expship_label").textContent =
              "Expedited Shipping - $" + data.expeditedShippingCost;
            document
              .querySelector('input[name="shippingOption"][value="1"]')
              .setAttribute("amount", data.expeditedShippingCost);
          })
          .catch((error) => {
            console.error("Error fetching auction:", error);
            // You could show an error message on the page
            document.getElementById("itemDesc").textContent =
              "Error loading data";
          });
      };

      // 3) onRadio select
      const shippingOptions = document.querySelectorAll(
        'input[name="shippingOption"]'
      );

      // Add event listener to each radio button
      shippingOptions.forEach((option) => {
        option.addEventListener("change", function () {
          const token = localStorage.getItem("jwtToken"); // Retrieve JWT token

          if (!token) {
            alert("Authentication required. Please log in.");
            return;
          }

          const isExpedited = this.value === "1"; // true for expedited, false for standard
          const shippingUrl = `http://localhost:8080/api/auctions/${auctionID}?expShip=${isExpedited}`;

          fetch(shippingUrl, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
          })
            .then((response) => {
              if (!response.ok) {
                throw new Error("Failed to update shipping option.");
              }
              return response.text(); // Since your endpoint returns text
            })
            .then((message) => {
              console.log(message); // Log success message
              if (isExpedited) {
                document.getElementById("radioSelected").textContent =
                  "Express shipping selected. Additional fees will be applied.";
              } else {
                document.getElementById("radioSelected").textContent =
                  "No additional fees!";
              }
            })
            .catch((error) => {
              console.error("Error updating shipping option:", error);
              alert("Failed to update shipping option. Please try again.");
            });
        });
      });

      // 4) Pay Now button click
      document
        .getElementById("payNowButton")
        .addEventListener("click", function () {
          // Get the currently displayed winning price from the DOM
          const winningPrice = parseFloat(
            document.getElementById("winningPrice").textContent
          );

          // Check which shipping option is selected
          const shippingRadios = document.querySelectorAll(
            'input[name="shippingOption"]'
          );
          let shippingCost = 0;
          shippingRadios.forEach((radio) => {
            if (radio.checked) {
              shippingCost = parseFloat(radio.getAttribute("amount"));
            }
          });

          // Calculate total
          const total = winningPrice + shippingCost;

          // alert user of total cost
          alert(`Total cost is $${total.toFixed(2)} (including shipping).`);

          // call payment endpoints
          // fetch auction
          fetch(auctionUrl)
            .then((response) => {
              console.log(response);
              if (!response.ok) {
                throw new Error("Failed to fetch auction data");
              }
              return response.json();
            })
            .then((auction) => {
              // ✅ Fixed by removing extra parentheses
              const token = localStorage.getItem("jwtToken");
              const paymentUrl = `http://localhost:8080/api/payments/${auction.id}/5/pay`;

              fetch(paymentUrl, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`,
                },
              })
                .then((paymentResponse) => {
                  if (!paymentResponse.ok) {
                    return paymentResponse.text().then((errorText) => {
                      throw new Error(errorText || "Payment failed");
                    });
                  }
                  return paymentResponse.text();
                })
                .then((paymentResults) => {
                  alert(paymentResults);
                  console.log("Payment success");
                })
                .catch((error) => {
                  console.error("Error during payment:", error);
                  alert(`Payment failed: ${error.message}`);
                });
            });

          // now redirect to shipment information page

          // Example: Call a "pay" endpoint with the total
          // fetch(`http://localhost:8080/api/auctions/${auctionID}/pay`, {
          //   method: "POST",
          //   headers: { "Content-Type": "application/json" },
          //   body: JSON.stringify({ total })
          // })
          // .then(res => res.json())
          // .then(result => {
          //   alert("Payment processed!");
          //   // Possibly redirect to a confirmation page
          // })
          // .catch(err => console.error(err));
        });
    </script>
  </body>
</html>
